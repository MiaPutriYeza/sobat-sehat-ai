<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SobatSehat AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { sage: '#87A96B', cream: '#FDF7F0', dark: '#2D3748' }
                }
            }
        }
    </script>
    <style>
        #sidebar { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-closed { width: 85px !important; }
        .sidebar-closed .nav-text, .sidebar-closed .logo-text, .sidebar-closed #history-section { display: none; }
        .sidebar-closed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .context-menu-active { transform: scale(100%) !important; opacity: 1 !important; pointer-events: auto !important; }

        #notification-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .notification { background-color: white; color: #2D3748; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; border-left: 4px solid #87A96B; }
        .notification.show { transform: translateX(0); opacity: 1; }
        .notification.error { border-left-color: #EF4444; }
        .notification-icon { width: 20px; height: 20px; }
        .notification.error .notification-icon { color: #EF4444; }
        .notification:not(.error) .notification-icon { color: #87A96B; }
    </style>
</head>
<body class="bg-[#F8FAFC] h-screen overflow-hidden text-gray-800 font-sans flex">

    <div id="notification-container"></div>

    <aside id="sidebar" class="w-64 bg-white border-r border-gray-100 flex flex-col h-full py-6 px-4 relative flex-shrink-0">
        <div class="flex items-center gap-3 px-2 mb-10 overflow-hidden">
            <div class="w-8 h-8 rounded-lg bg-sage flex-shrink-0 flex items-center justify-center text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </div>
            <span class="logo-text text-xl font-bold tracking-tight text-gray-800 whitespace-nowrap">Sobat<span class="text-sage">Sehat</span></span>
        </div>

        <nav class="flex flex-col gap-2">
            <a href="/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg transition-all {% if active_page == 'home' %} bg-sage text-white shadow-md {% else %} text-gray-500 hover:bg-gray-50 {% endif %}">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="nav-text whitespace-nowrap">Home</span>
            </a>

            <div class="flex flex-col">
                <a href="/chat" class="nav-item flex items-center justify-between px-4 py-3 rounded-lg transition-all {% if active_page == 'chat' %} bg-sage text-white shadow-md {% else %} text-gray-500 hover:bg-gray-50 {% endif %}">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span class="nav-text whitespace-nowrap">Chat AI</span>
                    </div>
                    <button onclick="toggleHistory(event)" id="history-arrow-btn" class="p-1 rounded-full {% if active_page == 'chat' %} hover:bg-white/20 {% else %} hover:bg-gray-200 text-gray-400 hover:text-sage {% endif %} transition-all duration-200">
                        <svg id="history-arrow-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                </a>

                <div id="history-section" class="hidden flex flex-col pl-10 pr-2 space-y-1 mt-2 max-h-60 overflow-y-auto no-scrollbar">
                    <span class="text-[10px] text-gray-400 uppercase tracking-widest font-bold mb-2 ml-2">Riwayat Terbaru</span>
                    <div id="history-items" class="space-y-1"></div>
                </div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 h-full overflow-hidden flex flex-col bg-white rounded-l-xl border-l border-gray-100 relative">
        <header class="absolute top-0 right-0 left-0 h-16 flex items-center justify-end px-8 z-[60] pointer-events-none">
            <div class="flex items-center gap-4 pointer-events-auto">
                <div onclick="toggleAuthModal()" id="profile-trigger" class="w-10 h-10 rounded-full border-2 border-sage/20 p-[2px] cursor-pointer hover:border-sage transition-all flex items-center justify-center">
                    <div id="profile-icon-container" class="w-full h-full rounded-full bg-sage flex items-center justify-center text-white font-bold shadow-sm text-sm">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                </div>
            </div>
        </header>
        <div class="flex-1 h-full w-full">{% block content %}{% endblock %}</div>
    </main>

    <div id="history-context-menu" 
         class="hidden fixed z-[999] w-40 bg-[#F1F3F4] border border-sage/30 shadow-xl rounded-xl py-1.5 transition-all transform scale-95 opacity-0 origin-top-left pointer-events-none">
        <button onclick="handleHistoryAction('pin')" class="w-full text-left px-3 py-2 hover:bg-sage/10 flex items-center gap-2.5 text-xs font-medium text-gray-700 transition-colors group">
            <svg class="w-4 h-4 text-gray-400 group-hover:text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span id="pin-text-label">Sematkan</span>
        </button>
        <button onclick="handleHistoryAction('rename')" class="w-full text-left px-3 py-2 hover:bg-sage/10 flex items-center gap-2.5 text-xs font-medium text-gray-700 transition-colors group">
            <svg class="w-4 h-4 text-gray-400 group-hover:text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            Ganti nama
        </button>
        <div class="h-[1px] bg-sage/20 my-1 mx-2"></div>
        <button onclick="handleHistoryAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-50 flex items-center gap-2.5 text-xs font-bold text-red-500 transition-colors group">
            <svg class="w-4 h-4 text-red-400 group-hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            Hapus
        </button>
    </div>

    <div id="action-modal" class="fixed inset-0 z-[300] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-dark/40 backdrop-blur-sm" onclick="closeActionModal()"></div>
        <div id="action-card" class="bg-white w-full max-w-sm p-6 rounded-xl shadow-2xl relative transform transition-all scale-95 opacity-0 duration-300">
            <h3 id="modal-action-title" class="text-lg font-bold text-gray-800 mb-2">Ganti Nama</h3>
            <p id="modal-action-desc" class="text-sm text-gray-500 mb-6">Masukkan nama baru untuk riwayat ini.</p>
            <div id="modal-input-container" class="mb-6">
                <input type="text" id="modal-action-input" placeholder="Nama riwayat..." class="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-lg focus:ring-2 focus:ring-sage/20 focus:border-sage outline-none text-sm transition-all">
            </div>
            <div class="flex gap-3">
                <button onclick="closeActionModal()" class="flex-1 bg-gray-100 text-gray-600 py-3 rounded-lg font-bold hover:bg-gray-200 transition-all text-sm">Batal</button>
                <button id="modal-confirm-btn" class="flex-1 bg-sage text-white py-3 rounded-lg font-bold hover:bg-[#769e82] transition-all shadow-lg shadow-sage/20 text-sm">Simpan</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-dark/40 backdrop-blur-sm" onclick="toggleAuthModal()"></div>
        <div id="auth-card" class="bg-white w-full max-w-md p-8 rounded-xl shadow-2xl relative transform transition-all scale-95 opacity-0 duration-300">
            <button onclick="toggleAuthModal()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            <div id="auth-form-container">
                <h2 id="auth-title" class="text-2xl font-bold text-gray-800 mb-2 text-center">Selamat Datang</h2>
                <div class="space-y-4 mt-8">
                    <input type="email" id="auth-email" placeholder="Email" class="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-lg focus:ring-2 focus:ring-sage/20 text-sm">
                    <input type="password" id="auth-password" placeholder="Password" class="w-full bg-gray-50 border border-gray-100 px-4 py-3 rounded-lg focus:ring-2 focus:ring-sage/20 text-sm">
                    <button onclick="handleAuthAction()" id="auth-btn" class="w-full bg-sage text-white py-3 rounded-lg font-bold hover:bg-[#769e82] transition-all">Lanjutkan</button>
                    <p class="text-center text-xs text-gray-500"><span id="auth-toggle-text">Belum punya akun?</span> <button onclick="switchAuthMode()" id="auth-toggle-btn" class="text-sage font-bold hover:underline">Daftar</button></p>
                </div>
            </div>
            <div id="profile-info" class="hidden text-center">
                <div id="info-avatar" class="w-20 h-20 bg-sage rounded-full mx-auto flex items-center justify-center text-white text-3xl font-bold mb-4"></div>
                <h3 id="info-email" class="font-bold text-gray-800"></h3>
                <button onclick="logout()" class="w-full bg-red-50 text-red-500 py-3 rounded-lg font-bold mt-8 border border-red-100">Keluar</button>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let selectedChatId = null;
        const authModal = document.getElementById('auth-modal');
        const authCard = document.getElementById('auth-card');
        const contextMenu = document.getElementById('history-context-menu');
        const actionModal = document.getElementById('action-modal');
        const actionCard = document.getElementById('action-card');
        const actionInput = document.getElementById('modal-action-input');
        const confirmBtn = document.getElementById('modal-confirm-btn');

        async function handleAuthAction() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const url = isLoginMode ? '/api/login' : '/api/register';
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
                const data = await res.json();
                if (res.ok) {
                    if (isLoginMode) { localStorage.setItem('userEmail', data.email); updateUI(); toggleAuthModal(); showNotification("Login berhasil!"); }
                    else { showNotification("Registrasi sukses! Silakan login."); switchAuthMode(); }
                } else showNotification(data.error, 'error');
            } catch (e) { showNotification("Server error", 'error'); }
        }

        function updateUI() {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                const initial = userEmail.charAt(0).toUpperCase();
                document.getElementById('profile-icon-container').innerText = initial;
                document.getElementById('info-avatar').innerText = initial;
                document.getElementById('info-email').innerText = userEmail;
                document.getElementById('auth-form-container').classList.add('hidden');
                document.getElementById('profile-info').classList.remove('hidden');
                loadHistory();
            } else {
                document.getElementById('profile-icon-container').innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"></path></svg>';
                document.getElementById('auth-form-container').classList.remove('hidden');
                document.getElementById('profile-info').classList.add('hidden');
                document.getElementById('history-items').innerHTML = '<p class="italic text-[10px] text-gray-400 p-2">Login untuk riwayat</p>';
            }
        }

        function loadFullChat(sessionId) {
            if (window.location.pathname === '/chat') {
                if (typeof fetchFullChat === 'function') {
                    fetchFullChat(sessionId);
                }
            } else {
                window.location.href = `/chat?session_id=${sessionId}`;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const container = document.getElementById('history-items');
                
                container.innerHTML = ''; 

                if (data.history && data.history.length > 0) {
                    container.innerHTML = data.history.map(item => `
                        <div onclick="loadFullChat(${item.id})" class="group flex items-center justify-between px-3 py-2 hover:bg-gray-50 rounded-lg transition-all cursor-pointer relative gap-2">
                            <span class="text-xs text-gray-600 truncate flex-1 font-medium">
                                ${item.title}
                            </span>

                            ${item.is_pinned ? `
                                <div class="text-sage p-0.5 flex-shrink-0" title="Tersemat">
                                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </div>
                            ` : ''}

                            <button onclick="openContextMenu(event, ${item.id}, ${item.is_pinned})" class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-sage transition-all flex-shrink-0">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path></svg>
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="italic text-[10px] text-gray-400 p-2 text-center w-full">Belum ada riwayat.</p>';
                }
            } catch (e) { console.error("Gagal muat riwayat"); }
        }

        function openContextMenu(e, id, isPinned) {
            e.preventDefault();
            e.stopPropagation();
            selectedChatId = id;
            
            document.getElementById('pin-text-label').innerText = isPinned ? 'Lepaskan' : 'Sematkan';

            contextMenu.classList.remove('hidden');
            const rect = e.currentTarget.getBoundingClientRect();
            contextMenu.style.top = `${rect.top}px`;
            contextMenu.style.left = `${rect.right + 10}px`;
            setTimeout(() => contextMenu.classList.add('context-menu-active'), 10);
        }

        function closeActionModal() {
            actionCard.classList.remove('scale-100', 'opacity-100');
            actionCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => actionModal.classList.add('hidden'), 300);
        }

        function openActionModal(config) {
            document.getElementById('modal-action-title').innerText = config.title;
            document.getElementById('modal-action-desc').innerText = config.desc;
            const inputCont = document.getElementById('modal-input-container');
            if (config.showInput) {
                inputCont.classList.remove('hidden');
                actionInput.value = config.currentValue || '';
            } else {
                inputCont.classList.add('hidden');
            }
            confirmBtn.innerText = config.confirmText;
            confirmBtn.className = config.danger ? 
                "flex-1 bg-red-500 text-white py-3 rounded-lg font-bold hover:bg-red-600 transition-all shadow-lg shadow-red-200 text-sm" :
                "flex-1 bg-sage text-white py-3 rounded-lg font-bold hover:bg-[#769e82] transition-all shadow-lg shadow-sage/20 text-sm";
            confirmBtn.onclick = config.onConfirm;
            actionModal.classList.remove('hidden');
            setTimeout(() => {
                actionCard.classList.remove('scale-95', 'opacity-0');
                actionCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

async function handleHistoryAction(action) {
            if (action === 'delete') {
                openActionModal({
                    title: "Hapus Sesi Chat?",
                    desc: "Tindakan ini tidak dapat dibatalkan. Seluruh percakapan dalam sesi ini akan dihapus permanen.",
                    confirmText: "Hapus Sekarang",
                    danger: true,
                    showInput: false,
                    onConfirm: async () => { await executeHistoryUpdate('delete'); closeActionModal(); }
                });
            } else if (action === 'rename') {
                openActionModal({
                    title: "Ganti Judul Sesi",
                    desc: "Ubah judul riwayat agar lebih mudah ditemukan nanti.",
                    confirmText: "Simpan Perubahan",
                    showInput: true,
                    onConfirm: async () => {
                        const title = actionInput.value.trim();
                        if (!title) return showNotification("Nama tidak boleh kosong!", 'error');
                        await executeHistoryUpdate('rename', title);
                        closeActionModal();
                    }
                });
            } else if (action === 'pin') {
                await executeHistoryUpdate('pin');
            }
        }

        async function executeHistoryUpdate(action, title = null) {

            let body = { id: selectedChatId, action: action };
            if (title) body.title = title;
            
            try {
                const res = await fetch('/api/history/update', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify(body) 
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    loadHistory();
                    
                    if(action === 'delete' && (typeof currentSessionId !== 'undefined') && currentSessionId === selectedChatId) {
                        window.location.href = '/chat';
                    }
                } else {
                    showNotification(data.error, 'error');
                }
            } catch (e) { 
                showNotification("Gagal memperbarui data.", 'error'); 
            }
        }

        function startNewChat() {
            window.location.href = '/chat';
        }

        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                contextMenu.classList.remove('context-menu-active');
                setTimeout(() => contextMenu.classList.add('hidden'), 200);
            }
        });

        function toggleAuthModal() {
            const isHidden = authModal.classList.contains('hidden');
            if (isHidden) {
                authModal.classList.remove('hidden');
                setTimeout(() => { authCard.classList.remove('scale-95', 'opacity-0'); authCard.classList.add('scale-100', 'opacity-100'); }, 10);
            } else {
                authCard.classList.remove('scale-100', 'opacity-100'); authCard.classList.add('scale-95', 'opacity-0');
                setTimeout(() => authModal.classList.add('hidden'), 300);
            }
        }

        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Selamat Datang' : 'Buat Akun';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Lanjutkan' : 'Daftar Sekarang';
        }

        async function logout() { await fetch('/api/logout'); localStorage.removeItem('userEmail'); location.reload(); }
        function toggleHistory(e) { e.preventDefault(); document.getElementById('history-section').classList.toggle('hidden'); document.getElementById('history-arrow-icon').classList.toggle('rotate-180'); }
        function toggleSidebar() { const sb = document.getElementById('sidebar'); sb.classList.toggle('sidebar-closed'); localStorage.setItem('sidebarStatus', sb.classList.contains('sidebar-closed') ? 'closed' : 'open'); }
        window.addEventListener('DOMContentLoaded', () => { updateUI(); const sb = document.getElementById('sidebar'); if (localStorage.getItem('sidebarStatus') === 'closed') sb.classList.add('sidebar-closed'); });

        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container');
            if (!container) return;
            const notifId = `notif-${Date.now()}`;
            const iconSvg = type === 'error' 
                ? `<svg class="notification-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="notification-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            const notif = document.createElement('div');
            notif.id = notifId;
            notif.className = `notification ${type === 'error' ? 'error' : ''}`;
            notif.innerHTML = `
                ${iconSvg}
                <p class="text-sm font-medium">${message}</p>
            `;
            
            container.appendChild(notif);

            setTimeout(() => {
                notif.classList.add('show');
            }, 10);

            setTimeout(() => {
                notif.classList.remove('show');
                setTimeout(() => {
                    if (container.contains(notif)) {
                        container.removeChild(notif);
                    }
                }, 500);
            }, 4000);
        }
    </script>
</body>
</html>
